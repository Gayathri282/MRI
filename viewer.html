<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Touch 3D MRI Volume Viewer</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #080a0f; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
    #canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
    .panel { position: absolute; top: 16px; left: 16px; background: rgba(18, 22, 34, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 16px; width: min(300px, calc(100vw - 32px)); z-index: 10; }
    h2 { font-size: 0.95rem; margin: 0 0 12px 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.05em; }
    .row { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
    .label-line { display: flex; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; }
    input[type="range"] { width: 100%; accent-color: #38bdf8; }
    .axes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .axes button { background: #1e2536; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; padding: 6px 0; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .axes button.active { background: #38bdf8; color: #000; font-weight: bold; border-color: transparent; }
    select, .upload-btn { width: 100%; background: #1e2536; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 8px; border-radius: 6px; font-size: 0.8rem; }
    .upload-btn { display: block; text-align: center; background: #0284c7; cursor: pointer; position: relative; overflow: hidden; margin-top: 4px; font-weight: 500; }
    .upload-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    #hints { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; color: #94a3b8; pointer-events: none; }
    #file-banner { display: none; position: absolute; top: 16px; right: 16px; max-width: min(380px, calc(100vw - 364px)); min-width: 260px; background: rgba(120, 53, 15, 0.92); border: 1px solid rgba(251,191,36,0.5); border-radius: 12px; padding: 14px 16px; font-size: 0.8rem; line-height: 1.45; color: #fef3c7; z-index: 20; user-select: text; -webkit-user-select: text; }
    #file-banner strong { color: #fbbf24; }
    #file-banner a { color: #7dd3fc; font-weight: 600; }
    #file-banner code { background: rgba(0,0,0,0.35); padding: 1px 5px; border-radius: 4px; }
    @media (max-width: 700px) { #file-banner { top: auto; bottom: 64px; right: 16px; left: 16px; max-width: none; } }
  </style>
  <script src="https://unpkg.com/@niivue/niivue@0.69.0/dist/niivue.umd.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="panel">
    <h2>3D Scan Controls</h2>
    
    <div class="row">
      <div class="label-line">
        <span>Clip Plane Depth</span>
        <span id="depth-txt">0 mm</span>
      </div>
      <input type="range" id="clip-slider" min="-120" max="120" value="0" step="1">
    </div>

    <div class="row">
      <div class="axes" id="axis-btns">
        <button class="active" data-axis="axial">Axial (Z)</button>
        <button data-axis="coronal">Coronal (Y)</button>
        <button data-axis="sagittal">Sagittal (X)</button>
      </div>
    </div>

    <div class="row">
      <div class="label-line"><span>Transfer Function</span></div>
      <select id="cmap">
        <option value="gray">Grayscale (Standard MRI)</option>
        <option value="plasma">Plasma</option>
        <option value="turbo">Turbo</option>
        <option value="actc">ACTC</option>
      </select>
    </div>

    <label class="upload-btn">
      <span id="upload-label">Open Local .nii / .nii.gz / .dcm</span>
      <input type="file" id="file-pick" multiple accept=".nii,.nii.gz,.mgz,.mgh,.nrrd,.nhdr,.mha,.mhd,.dcm,.dicom">
    </label>
  </div>

  <div id="hints">1-Finger: Rotate | Pinch: Zoom | 2-Finger Drag: Pan</div>

  <div id="file-banner" role="alert">
    <strong>Opened as a file.</strong> 3D scans (.nii) work, but DICOM (.dcm) needs the local server.<br>
    Start it with <code>start-viewer.bat</code> (in the MRI folder), then open
    <a href="http://localhost:8000/">http://localhost:8000/</a>
  </div>

  <script>
    // Opened straight from disk (file://)? DICOM conversion can't run there, so look for the
    // local server and hop over to it automatically; otherwise tell the user how to start it.
    if (location.protocol === "file:") {
      const banner = document.getElementById("file-banner");
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), 2500);
      fetch("http://localhost:8000/viewer.html", { mode: "no-cors", cache: "no-store", signal: ctrl.signal })
        .then(() => location.replace("http://localhost:8000/"))
        .catch(() => { banner.style.display = "block"; });
    }

    const canvas = document.getElementById("canvas");
    const slider = document.getElementById("clip-slider");
    const depthTxt = document.getElementById("depth-txt");
    const cmap = document.getElementById("cmap");
    const filePick = document.getElementById("file-pick");
    const axisBtns = document.querySelectorAll("#axis-btns button");

    const nv = new niivue.Niivue({
      backColor: [0.03, 0.04, 0.06, 1.0],
      show3Dcrosshair: false,
      loadingText: 'Loading 3D Volume...'
    });

    nv.attachToCanvas(canvas);
    nv.setSliceType(nv.sliceTypeRender);

    let currentAxis = 'axial';
    function updatePlane() {
      const d = parseFloat(slider.value);
      depthTxt.textContent = d + " mm";
      if (currentAxis === 'axial') nv.setClipPlane([0, 0, 1, d]);
      if (currentAxis === 'coronal') nv.setClipPlane([0, 1, 0, d]);
      if (currentAxis === 'sagittal') nv.setClipPlane([1, 0, 0, d]);
    }

    // Default sample brain volume
    nv.loadVolumes([{
      url: "https://niivue.github.io/niivue-demo-images/mni152.nii.gz",
      colormap: "gray"
    }]).then(() => {
      nv.setSliceType(nv.sliceTypeRender);
      updatePlane();
    });

    slider.addEventListener("input", updatePlane);

    axisBtns.forEach(b => {
      b.addEventListener("click", () => {
        axisBtns.forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        currentAxis = b.dataset.axis;
        updatePlane();
      });
    });

    cmap.addEventListener("change", (e) => {
      if (nv.volumes.length) {
        nv.setColorMap(nv.volumes[0].id, e.target.value);
        nv.updateGLVolume();
      }
    });

    // DICOM -> NIfTI conversion (dcm2niix WASM), loaded lazily only when needed.
    // Browsers only start a Web Worker from the page's own origin, so the converter is
    // served locally from ./vendor/dcm2niix (see vendor/fetch-dcm2niix.js). That also means
    // the page must be served over http://, not opened as a file:// URL.
    const DCM2NIIX_URL = new URL("./vendor/dcm2niix/index.js", location.href).href;
    let dicomLoaderPromise = null;

    async function initDcm2niix() {
      if (location.protocol === "file:") {
        throw new Error(
          "DICOM conversion needs the page to be served over http. " +
          "Double-click start-viewer.bat (or run `node serve.js`) and open http://localhost:8000/ instead of opening the file directly."
        );
      }
      const { Dcm2niix } = await import(DCM2NIIX_URL);
      const dcm2niix = new Dcm2niix();
      await dcm2niix.init();
      return dcm2niix;
    }

    function getDicomLoader() {
      if (!dicomLoaderPromise) {
        dicomLoaderPromise = initDcm2niix()
          .then(dcm2niix => async (files) => {
            const out = await dcm2niix.input(files).run();
            const nii = out.filter(f => /\.nii(\.gz)?$/i.test(f.name));
            return Promise.all(nii.map(async f => ({ name: f.name, data: await f.arrayBuffer() })));
          })
          .catch(err => { dicomLoaderPromise = null; throw err; });
      }
      return dicomLoaderPromise;
    }

    function replaceVolumes() {
      [...nv.volumes].forEach(v => nv.removeVolume(v));
    }

    const isDicom = f => /\.(dcm|dicom)$/i.test(f.name);

    console.info("[viewer] build: dicom-support v4 (local worker)");

    filePick.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      console.group("[viewer] loading " + files.length + " file(s)");
      files.slice(0, 5).forEach(f => console.log("file:", f.name, "| size:", f.size, "bytes | type:", f.type || "(none)", "| dicom:", isDicom(f)));
      if (files.length > 5) console.log("... and " + (files.length - 5) + " more");

      try {
        if (files.some(isDicom)) {
          // One or many DICOM slices -> a single NIfTI volume
          console.log("route: DICOM -> dcm2niix -> NIfTI");
          const dicomLoader = await getDicomLoader();
          const converted = await dicomLoader(files.filter(isDicom));
          console.log("converted volumes:", converted.map(c => c.name + " (" + c.data.byteLength + " bytes)"));
          if (!converted.length) throw new Error("No volume could be built from the DICOM file(s)");
          replaceVolumes();
          await nv.loadFromArrayBuffer(converted[0].data, converted[0].name);
        } else {
          console.log("route: nv.loadFromFile");
          replaceVolumes();
          await nv.loadFromFile(files[0]);
        }
        console.log("loaded OK; volumes now:", nv.volumes.length);
        nv.setSliceType(nv.sliceTypeRender);
        updatePlane();
      } catch (err) {
        console.error("Error loading volume:", err);
        alert("Could not load file: " + (err && err.message ? err.message : err));
      } finally {
        console.groupEnd();
        filePick.value = "";
      }
    });

    window.addEventListener("resize", () => nv.resizeListener());
  </script>
</body>
</html>
